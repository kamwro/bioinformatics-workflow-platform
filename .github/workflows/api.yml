name: API CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "cli/**"
      - "migrations/**"
      - "scripts/**"
      - "tests/**"
      - "alembic.ini"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/api.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "cli/**"
      - "migrations/**"
      - "scripts/**"
      - "tests/**"
      - "alembic.ini"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/api.yml"

jobs:
  quality:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bioflowops
          POSTGRES_USER: bioflowops
          POSTGRES_PASSWORD: bioflowops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bioflowops -d bioflowops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --extra dev --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy app cli scripts

      - name: Verify PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://bioflowops:bioflowops@localhost:5432/bioflowops
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: pytest
        run: uv run pytest -v

  sbom-scan:
    name: SBOM + Vulnerability Scan
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-api.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-sbom
          path: sbom-api.spdx.json

      - name: Scan with Grype
        uses: anchore/scan-action@v7
        with:
          sbom: sbom-api.spdx.json
          fail-build: false
          output-format: sarif
          output-file: results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ./results.sarif
